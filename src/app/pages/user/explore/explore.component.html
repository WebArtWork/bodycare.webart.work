<div class="explore">
	<div class="explore__header">
		<h1 class="explore__title" translate>Пошук</h1>

		<input
			pInputText
			type="text"
			placeholder="Назва або опис послуги"
			class="explore__search"
			[ngModel]="searchTerm()"
			(ngModelChange)="searchTerm.set($event)"
		/>

		<p-multiSelect
			appendTo="body"
			scrollHeight="auto"
			[options]="categoryOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Категорія"
			class="explore__filter"
			[ngModel]="selectedCategories()"
			(ngModelChange)="selectedCategories.set($event)"
		/>

		<p-select
			appendTo="body"
			scrollHeight="auto"
			[options]="serviceStatusOptions"
			optionLabel="label"
			optionValue="value"
			placeholder="Статус"
			[showClear]="true"
			class="explore__filter"
			[ngModel]="selectedStatus()"
			(ngModelChange)="selectedStatus.set($event)"
		/>

		<a pButton routerLink="/map" severity="secondary" size="small" class="explore__map-link" translate>Карта</a>
	</div>

	<div class="explore__grid">
		@for (row of results(); track row.service._id) {
		<div class="explore__row" (click)="view(row.service)">
			<app-service-short
				[entity]="row.service"
				[specialist]="row.relations.specialist"
				[venue]="row.relations.venue"
				(relationClick)="viewRelation($event)"
			/>
		</div>
		} @empty {
		<p class="explore__empty" translate>За заданими критеріями послуг не знайдено.</p>
		}
	</div>
</div>
