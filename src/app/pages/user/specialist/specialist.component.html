<section class="specialist">

	@if (entity(); as item) {
	<div class="specialist__actions">
		<button pButton type="button" severity="secondary" size="small" (click)="share()">
			<i class="pi pi-share-alt"></i>
			{{ translateService.translate('Поділитися')() }}
		</button>
	</div>
	<app-specialist-view [entity]="item" />
	} @else {
	<p-card class="specialist__not-found">
		<p>Спеціаліста не знайдено.</p>
	</p-card>
	}
</section>
