<section class="venues">
	<header class="venues__header">
		<h2 class="venues__title">Заклади</h2>
		<span class="venues__hint">Перегляньте всі заклади краси та фітнесу BodyCare</span>
	</header>

	<p-card class="venues__filters">
		<div class="venues__field">
			<label for="venues-search">Пошук</label>
			<input
				id="venues-search"
				pInputText
				type="text"
				placeholder="Назва, місто або країна"
				[fluid]="true"
				[ngModel]="searchTerm()"
				(ngModelChange)="searchTerm.set($event)"
			/>
		</div>
	</p-card>

	<div class="venues__results">
		<span class="venues__count">Знайдено закладів: {{ results().length }}</span>

		<div class="venues__grid">
			@for (item of results(); track item._id) {
			<div class="venues__row" (click)="view(item)">
				<app-venue-short [entity]="item" />
			</div>
			} @empty {
			<p class="venues__empty">За заданим запитом закладів не знайдено.</p>
			}
		</div>
	</div>
</section>
