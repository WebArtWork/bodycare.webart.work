<section class="editor">
	<p-card header="Редактор">
		<div class="editor__picker">
			<p-selectbutton
				[options]="options"
				optionLabel="label"
				optionValue="value"
				[ngModel]="selectedType()"
				(ngModelChange)="selectedType.set($event)"
			/>
		</div>

		@switch (selectedType()) {
			@case ('service') {
				<app-service-form />
			}
			@case ('record') {
				<app-record-form />
			}
			@case ('venue') {
				<app-venue-form />
			}
			@case ('specialist') {
				<app-specialist-form />
			}
			@case ('request') {
				<app-request-form />
			}
		}

		<div class="editor__actions">
			<button pButton type="button" (click)="wValidate()">Перевірити</button>
		</div>
	</p-card>
</section>
