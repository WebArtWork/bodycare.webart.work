<section class="venue">

	@if (entity(); as item) {
	<div class="venue__actions">
		<button pButton type="button" severity="secondary" size="small" (click)="share()">
			<i class="pi pi-share-alt"></i>
			{{ translateService.translate('Поділитися')() }}
		</button>
	</div>
	<app-venue-view [entity]="item" />
	} @else {
	<p-card class="venue__not-found">
		<p translate>Заклад не знайдено.</p>
	</p-card>
	}
</section>
